[package]
name = "git-branch-tree"
version = "1.0.1"
edition = "2024"
rust-version = "1.88" # let-chains
description = "Compute the real dependency tree of stacked branches from content, not ancestry, and emit the exact rebase commands to un-flatten them"
repository = "https://github.com/pysan3/git-branch-tree"
homepage = "https://github.com/pysan3/git-branch-tree"
license = "MPL-2.0"
keywords = ["git", "stacked-prs", "rebase", "branch", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
# Repo infrastructure is not part of what people install. Keeping it out also stops a
# workflow tweak or a CONTRIBUTING edit from changing the published artifact, which is
# what makes release-plz treat it as a releasable change and cut a new patch version.
# src/ and tests/ stay in, so a published version can be verified by building and
# testing exactly what was shipped.
exclude = [
  ".github/",
  ".gitignore",
  ".typos.toml",
  "CONTRIBUTING.md",
  "deny.toml",
  "release-plz.toml",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
gix = { version = "0.86", features = ["blob-diff", "revision"] }
glob = "0.3"
rayon = "1"
shlex = "2.0.1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = "thin"

# Stated explicitly rather than relying on cargo-binstall's inference, so the archive
# names release.yml uploads and the ones binstall fetches cannot drift apart.
[package.metadata.binstall]
# The extension is written out rather than taken from `{ archive-suffix }`: that
# expands with its own leading dot, and for pkg-fmt tgz it is `.tgz`, neither of which
# matches the `.tar.gz` the upload job produces. Getting it wrong is invisible - binstall
# just falls back to building from source, which is exactly what it exists to avoid.
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
