# cargo-deny: supply-chain and licence gate. See https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences, plus MPL-2.0 for uluru (via gix-pack) and this crate itself.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
