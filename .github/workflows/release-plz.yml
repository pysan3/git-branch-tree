name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # crates.io Trusted Publishing exchanges this for a short-lived token, so no
      # CARGO_REGISTRY_TOKEN secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN: tags pushed with GITHUB_TOKEN do not trigger other
          # workflows, so release.yml would never build the binaries.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Publish and tag
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
