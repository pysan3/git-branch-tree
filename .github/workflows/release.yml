name: release

# Fires on the tag release-plz pushes (hence the PAT there: a GITHUB_TOKEN-pushed tag
# would not trigger this workflow). Attaches prebuilt archives to the GitHub Release that
# release-plz created, using the `$bin-$target.$ext` naming cargo-binstall expects.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # Native arm runner, so no cross toolchain is needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: git-branch-tree
          target: ${{ matrix.target }}
          archive: $bin-$target
          # .tar.gz everywhere except Windows, matching the binstall metadata in
          # Cargo.toml.
          tar: unix
          zip: windows
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
